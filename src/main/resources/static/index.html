    dadosDaApi.nodes.forEach(node => {
        elementosParaRenderizar.push({
            data: {
                id: node.id,
                group: node.group,
                label: node.id
            }
        });
    });

    // Adiciona as Arestas (Cabos)
    dadosDaApi.edges.forEach(edge => {
        elementosParaRenderizar.push({
            data: {
                id: edge.id.trim(), // trim() para limpar o "M  T-1" que vimos antes
                source: edge.source,
                target: edge.target,
                type: edge.type
            }
        });
    });
